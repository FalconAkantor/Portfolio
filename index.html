<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="color-scheme" content="dark" />
    <!--head:start-->
    <title>AUTOMARIZA · Nacho — AI, automation & systems developer</title>
    <meta name="description" content="AUTOMARIZA — automation that reasons. AI, automation and systems by Nacho." />
    <!--head:end-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      /*
       * Runs before first paint:
       *  1. Redirects only "upwards", never the other way round, so shared links always work:
       *     English → /es/ for Spanish-speaking first-time visitors (or a stored preference),
       *     tech → lite/ when the visitor already chose the simple version.
       *  2. On a tech page with no version chosen yet, shows the "tech or simple?" chooser.
       *     Otherwise, shows the boot sequence on a first visit, unless reduced motion is requested
       *     or the visitor arrives on a deep link (#section), which goes straight to the content.
       *     Fallback timers remove both overlays if the app bundle never starts.
       */
      (function () {
        var d = document.documentElement;
        try {
          var s = window.localStorage;
          var base = '%BASE_URL%';
          var path = location.pathname.replace(/index\.html$/, '');
          var rest = path.indexOf(base) === 0 ? path.slice(base.length) : '';
          var isEs = /^es(\/|$)/.test(rest);
          var isLite = d.getAttribute('data-mode') ? d.getAttribute('data-mode') === 'lite' : /(^|\/)lite\/?$/.test(rest);
          var pref = s.getItem('automariza:lang');
          var mode = s.getItem('automariza:mode');
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          var toEs = !isEs && (pref === 'es' || (!pref && /^es\b/i.test(nav)));
          var toLite = !isLite && mode === 'lite';
          if (toEs || toLite) {
            location.replace(base + (isEs || toEs ? 'es/' : '') + (isLite || toLite ? 'lite/' : '') + location.hash);
            return;
          }
          if (isLite) return;
          if (!mode) {
            d.classList.add('choosing');
            setTimeout(function () {
              if (!window.__automarizaChooser) d.classList.remove('choosing');
            }, 4000);
            return;
          }
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!s.getItem('automariza:booted') && !reduce && !location.hash) {
            d.classList.add('booting');
            setTimeout(function () {
              if (!window.__automarizaBoot) d.classList.remove('booting');
            }, 4000);
          }
        } catch (e) {
          /* storage blocked: no chooser, no boot sequence, no redirect */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript>
      <style>
        .hero__readout li { animation: none !important; }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
