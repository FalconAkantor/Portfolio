<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Archivo'; src: url('../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: 'Plex'; src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
      html, body { margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box; padding: 56px 64px;
        background-color: #05070a;
        background-image: linear-gradient(to right, rgb(255 255 255 / .035) 1px, transparent 1px), linear-gradient(to bottom, rgb(255 255 255 / .035) 1px, transparent 1px);
        background-size: 48px 48px; color: #d9dfe5; font-family: 'Plex', monospace;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .top { display: flex; justify-content: space-between; font-size: 22px; color: #8d99a6; }
      .top b { color: #d9dfe5; font-weight: 500; letter-spacing: .1em; }
      .top b i { font-style: normal; color: #f2a93b; border-bottom: 2px solid #f2a93b; }
      h1 { margin: 0; font-family: 'Archivo'; font-stretch: 125%; font-weight: 800; font-size: 118px; line-height: .9; letter-spacing: -.035em; text-transform: uppercase; }
      h1 span { display: block; }
      h1 .o { color: transparent; -webkit-text-stroke: 1.5px #8d99a6; }
      h1 .c { display: inline-block; width: 56px; height: 90px; background: #f2a93b; margin-left: 10px; }
      .bottom { display: flex; justify-content: space-between; align-items: flex-end; font-size: 22px; }
      .name { color: #d9dfe5; }
      .role { color: #8d99a6; margin-top: 6px; }
      .ok { color: #52d18e; }
      .flow { color: #5cc8d6; }
    </style>
  </head>
  <body>
    <div class="top"><b>AUTOMA<i>R</i>IZA</b><span>~/system/boot · <span class="ok">system ready</span></span></div>
    <h1><span>I build</span><span class="o">systems</span><span>that think.<i class="c"></i></span></h1>
    <div class="bottom">
      <div><div class="name">Nacho · AUTOMARIZA</div><div class="role">the R stands for Reasoning — automation that reasons</div></div>
      <div class="flow">[ ok ] idea → production</div>
    </div>
  </body>
</html>
