<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        #hook-box {
          position: absolute;
          left: 200px;
          right: 120px;
          top: 0;
          bottom: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 34px;
        }

        #hook-prompt {
          position: relative;
          font-family: var(--mono);
          font-size: 30px;
          font-weight: 500;
          color: var(--text);
          white-space: nowrap;
        }

        #hook-prompt .who {
          color: var(--signal);
        }

        #hook-prompt .dim {
          color: var(--text-faint);
        }

        #hook-head {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        .hook-row {
          position: relative;
          display: block;
          width: max-content;
          font-size: 176px;
        }

        .hook-line {
          position: relative;
          display: block;
          width: max-content;
          color: #e4e9ee;
          white-space: nowrap;
        }

        .hook-line--ghost {
          color: #070a0e;
          -webkit-text-stroke: 2px #6f7b89;
        }

        .hook-line .copy {
          position: absolute;
          left: 0;
          top: 0;
          opacity: 0;
          pointer-events: none;
          -webkit-text-stroke: 0;
        }

        .hook-line .copy--a {
          color: rgb(92 200 214 / 0.75);
        }

        .hook-line .copy--b {
          color: rgb(239 91 76 / 0.7);
        }

        .hook-line .fill {
          position: absolute;
          left: 0;
          top: 0;
          -webkit-text-stroke: 0;
          color: var(--signal);
          text-shadow: 0 0 40px rgb(242 169 59 / 0.45);
        }

        .caret {
          position: absolute;
          left: 0;
          top: 0.06em;
          width: 0.42em;
          height: 0.86em;
          background: var(--signal);
          box-shadow: 0 0 24px rgb(242 169 59 / 0.6);
          opacity: 0;
        }

        #hook-prompt .caret {
          top: 4px;
          height: 32px;
          width: 16px;
        }

        #hook-badge {
          display: flex;
          align-items: center;
          gap: 18px;
          width: max-content;
          padding: 12px 26px 12px 12px;
          border: 1px solid var(--line-2);
          border-radius: 999px;
          background: rgb(12 17 23 / 0.85);
          font-family: var(--mono);
          font-size: 28px;
          color: var(--text);
        }

        #hook-badge .r {
          display: grid;
          place-items: center;
          width: 52px;
          height: 52px;
          border-radius: 50%;
          border: 2px solid var(--signal);
          color: var(--signal);
          font-family: var(--display);
          font-weight: 800;
          font-size: 30px;
        }

        #hook-badge .dim {
          color: var(--text-dim);
        }

        .tall #hook-box {
          left: 64px;
          right: 40px;
          gap: 40px;
        }

        .tall .hook-row {
          font-size: 104px;
        }

        .tall #hook-prompt {
          font-size: 24px;
        }

        .tall #hook-prompt .caret {
          height: 26px;
          width: 13px;
        }

        .tall #hook-badge {
          font-size: 22px;
          flex-wrap: wrap;
          width: auto;
          border-radius: 28px;
        }
      </style>

      <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
        <div id="hook-box">
          <div id="hook-prompt"><span class="who">visitor@automariza</span><span class="dim">:~$ </span><span class="cmd">./construir --con-ia</span><span class="caret"></span></div>
          <h1 id="hook-head" class="display" aria-label="Construyo sistemas que piensan.">
            <span class="hook-row"><span class="hook-line">CONSTRUYO</span><span class="caret"></span></span>
            <span class="hook-row"><span class="hook-line hook-line--ghost">SISTEMAS<span class="copy copy--a">SISTEMAS</span><span class="copy copy--b">SISTEMAS</span><span class="fill">SISTEMAS</span></span><span class="caret"></span></span>
            <span class="hook-row"><span class="hook-line">QUE PIENSAN.</span><span class="caret"></span></span>
          </h1>
          <div id="hook-badge"><span class="r">R</span><span>La R es de Razonamiento</span><span class="dim">— automatización que razona.</span></div>
        </div>
      </div>

      <script>
        (function () {
          const box = document.getElementById('hook-box');
          const q = (s) => box.querySelector(s);
          const qa = (s) => Array.from(box.querySelectorAll(s));
          const tl = gsap.timeline({ paused: true });

          // Typing schedule (scene-local seconds). Shared with the soundtrack's key clicks.
          const CMD_T0 = 0.3;
          const CMD_STEP = 0.034;
          const HEAD_T0 = 1.2;
          const HEAD_STEP = 0.055;
          const texts = ['CONSTRUYO', 'SISTEMAS', 'QUE PIENSAN.'];
          const starts = [];
          let t0 = HEAD_T0;
          texts.forEach((txt) => {
            starts.push(t0);
            t0 += txt.length * HEAD_STEP + 0.12;
          });
          const HEAD_END = t0;

          const prompt = q('#hook-prompt');
          const cmd = q('#hook-prompt .cmd');
          const pCaret = q('#hook-prompt .caret');
          const lines = qa('.hook-line');
          const carets = lines.map((l) => l.parentElement.querySelector(':scope > .caret'));

          // Right edge of every character, measured once the scene is laid out.
          const edges = (el, n) => {
            const range = document.createRange();
            const node = el.firstChild;
            const base = el.getBoundingClientRect().left;
            const out = [];
            for (let i = 1; i <= n; i++) {
              range.setStart(node, 0);
              range.setEnd(node, i);
              out.push(range.getBoundingClientRect().right - base);
            }
            return out;
          };
          let m = null;
          const measure = () => {
            if (m) return m;
            if (!box.offsetWidth || document.fonts.status !== 'loaded') return null;
            m = {
              cmd: edges(cmd, cmd.textContent.length),
              cmdLeft: cmd.offsetLeft,
              lines: lines.map((l, i) => ({ xs: edges(l, texts[i].length), w: l.offsetWidth })),
            };
            return m;
          };

          const paint = (t) => {
            const M = measure();
            if (!M) return;
            // Prompt command
            const nc = Math.max(0, Math.min(M.cmd.length, Math.floor((t - CMD_T0) / CMD_STEP) + 1));
            const cx = t < CMD_T0 ? 0 : M.cmd[nc - 1];
            cmd.style.clipPath = `inset(-20% ${Math.max(0, cmd.offsetWidth - cx - 1)}px -20% 0)`;
            pCaret.style.transform = `translateX(${M.cmdLeft + cx + 4}px)`;
            pCaret.style.opacity = t < 1.12 ? 1 : 0;
            // Headline
            lines.forEach((line, i) => {
              const { xs, w } = M.lines[i];
              const s = starts[i];
              const n = Math.max(0, Math.min(xs.length, Math.floor((t - s) / HEAD_STEP) + 1));
              const x = t < s ? 0 : xs[n - 1];
              line.style.clipPath = t < s ? `inset(-20% ${w + 20}px -20% 0)` : n >= xs.length ? 'inset(-20% -200px -20% 0)' : `inset(-20% ${Math.max(0, w - x - 2)}px -20% 0)`;
              const end = s + xs.length * HEAD_STEP;
              let on = t >= s - 0.12 && t < end + 0.08;
              if (i === lines.length - 1 && t >= end) on = Math.floor((t - end) / 0.25) % 2 === 1 || t < end + 0.25;
              carets[i].style.opacity = on ? 1 : 0;
              carets[i].style.transform = `translateX(${x + 8}px)`;
            });
          };
          AMZ.drive(tl, 6, paint);

          tl.fromTo(prompt, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.1);
          tl.to(prompt, { opacity: 0.55, duration: 0.4 }, 1.2);

          // SISTEMAS: rift glitch, then it fills with the signal colour.
          const [ca, cb] = qa('.hook-line--ghost .copy');
          const fill = q('.hook-line--ghost .fill');
          const g0 = HEAD_END + 0.2;
          const jit = [
            [10, -6],
            [-14, 8],
            [6, -3],
            [-8, 5],
            [16, -9],
            [0, 0],
          ];
          tl.set([ca, cb], { opacity: 0, x: 0, y: 0 }, 0);
          jit.forEach(([a, b], k) => {
            tl.set(ca, { opacity: k === jit.length - 1 ? 0 : 1, x: a, y: -b / 2 }, g0 + k * 0.05);
            tl.set(cb, { opacity: k === jit.length - 1 ? 0 : 1, x: b, y: a / 3 }, g0 + k * 0.05);
          });
          tl.fromTo(fill, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.5, ease: 'expo.out' }, g0 + 0.3);

          // Brand badge.
          tl.fromTo('#hook-badge', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, 4.15);

          // Exit: a quick push up so the cut feels like a page turn.
          tl.to('#hook-box', { y: -50, opacity: 0, filter: 'blur(10px)', duration: 0.4, ease: 'power2.in' }, 5.6);

          window.__timelines['hook'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
