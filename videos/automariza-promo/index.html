<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>AUTOMARIZA — promo 16:9</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/helpers.js"></script>
    <link rel="stylesheet" href="assets/common.css">
    <style>
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--void);
      }

      [data-composition-id='main'] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }

      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 90;
        background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgb(0 0 0 / 0.55));
      }

      #fade {
        position: absolute;
        inset: 0;
        z-index: 95;
        background: #000;
        pointer-events: none;
      }

      /* Registry: grain-overlay (tuned down for a dark UI look) */
      @keyframes hf-grain-noise {
        0%,
        100% {
          transform: translate(0, 0);
        }
        10% {
          transform: translate(-5%, -5%);
        }
        20% {
          transform: translate(-10%, 5%);
        }
        30% {
          transform: translate(5%, -10%);
        }
        40% {
          transform: translate(-5%, 15%);
        }
        50% {
          transform: translate(-10%, 5%);
        }
        60% {
          transform: translate(15%, 0);
        }
        70% {
          transform: translate(0, 10%);
        }
        80% {
          transform: translate(-15%, 0);
        }
        90% {
          transform: translate(10%, 5%);
        }
      }

      #grain-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 100;
        overflow: hidden;
      }

      #grain-overlay .grain-texture {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.07;
        animation: hf-grain-noise 0.5s steps(1) 120;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="60" data-fps="30">
      <div id="el-bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="60" data-track-index="0" data-width="1920" data-height="1080"></div>

      <div id="el-hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-problem" data-composition-id="problem" data-composition-src="compositions/problem.html" data-start="6" data-duration="8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-cctv" data-composition-id="sys-cctv" data-composition-src="compositions/sys-cctv.html" data-start="14" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-inventory" data-composition-id="sys-inventory" data-composition-src="compositions/sys-inventory.html" data-start="20" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-docs" data-composition-id="sys-docs" data-composition-src="compositions/sys-docs.html" data-start="26" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-desk" data-composition-id="sys-desk" data-composition-src="compositions/sys-desk.html" data-start="32" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-workspace" data-composition-id="sys-workspace" data-composition-src="compositions/sys-workspace.html" data-start="38" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="44" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-how" data-composition-id="how" data-composition-src="compositions/how.html" data-start="50" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="54" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="vignette"></div>
      <div id="grain-overlay"><div class="grain-texture"></div></div>
      <div id="fade"></div>

      <audio id="el-music" src="assets/audio/soundtrack.wav" data-start="0" data-duration="60" data-track-index="10" data-volume="0.9"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#fade', { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power2.out' }, 0);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
